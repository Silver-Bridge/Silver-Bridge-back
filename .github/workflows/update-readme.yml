name: Manual README Update

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '커밋 메시지'
        required: false
        default: 'docs: Update README.md manually'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # 1. 현재 브랜치의 코드를 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2. 파이썬 환경을 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 작성해드린 파이썬 스크립트를 실행
      - name: Run README generator script
        run: |
          python generate_readme.py

      # 4. 변경 사항이 있다면 감지하고 커밋 & 푸시
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 변경 사항이 있는지 확인
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
            echo "README.md has been updated and pushed."
          else
            echo "⚠️ No changes detected in README.md."
          fi
